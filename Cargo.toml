[package]
name = "vision-hyper-agent"
version = "0.1.0"
edition = "2024"
description = "Agent-driven vision model training and deployment desktop application"
license = "MIT"
publish = false

[[test]]
name = "smoke"
path = "depoly/tests/smoke.rs"

[[test]]
name = "foundation"
path = "depoly/tests/foundation.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
