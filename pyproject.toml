[project]
name = "vision-hyper-agent"
version = "0.2.0"
description = "Agent 驱动的视觉模型标注与自动训练桌面软件"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_hyper_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
