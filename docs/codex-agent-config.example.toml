# Copy to <application directory>/config.local.toml. Do NOT commit credentials.
# A native Codex executable can instead be resolved from the application directory or PATH.
# codex_path = '/absolute/path/to/native/codex'
# Windows example:
# codex_path = 'C:\Tools\Codex\codex.exe'

base_url = 'https://your-provider.example/v1'
model = 'YOUR_MODEL_ID'
# Prefer the VHA_CODEX_API_KEY environment variable. For a portable private installation:
# api_key = 'YOUR_PRIVATE_KEY'

# Native Responses API, or explicit Chat Completions compatibility mode.
wire_api = 'responses'
# wire_api = 'chat_completions'

# Relative paths are resolved against the executable's directory.
workspace = 'data/workspace'
port = 8421
# Enable only after verifying the configured provider accepts image inputs.
supports_images = false
