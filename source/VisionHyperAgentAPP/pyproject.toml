[project]
name = "vision-hyper-agent-app"
version = "0.1.0"
description = "VisionHyperAgentAPP Python desktop client"
requires-python = ">=3.13,<3.14"
dependencies = [
    "eclipse-zenoh==1.10.1",
    "PySide6>=6.8,<7",
]

[project.scripts]
VisionHyperAgentAPP = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "view",
    "viewmodel",
    "model",
]
