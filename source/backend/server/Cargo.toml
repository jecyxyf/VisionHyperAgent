[package]
name = "vha-server"
description = "VisionHyperAgent local server: embeds frontend, serves HTTP/WS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rust-embed = { version = "8", features = ["compression"] }
webbrowser = "1"
mime_guess = "2"
tray-icon = "0.19"
tao = "0.31"
png = "0.17"

[build-dependencies]
embed-resource = "3.0.11"
