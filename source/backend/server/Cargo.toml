[package]
name = "vha-server"
description = "VisionHyperAgent local server: embeds frontend, serves HTTP/WS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
log = "0.4"
vha-common = { path = "../common" }
vha-codex-agent = { path = "../model/codex_agent" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8", features = ["compression"] }
webbrowser = "1"
mime_guess = "2"
tray-icon = "0.19"
tao = "0.31"
png = "0.17"

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
