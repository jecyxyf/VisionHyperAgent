[package]
name = "vha-codex-dds-agent"
description = "CodexDDSAgent service with Zenoh and Codex App Server adapters"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace]
members = ["test"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "url"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zenoh = { path = "../depends/zenoh/zenoh" }

[dev-dependencies]
tempfile = "3"
