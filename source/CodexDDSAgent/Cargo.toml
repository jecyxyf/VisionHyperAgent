[package]
name = "vha-codex-dds-agent"
description = "CodexDDSAgent service with Zenoh and Codex App Server adapters"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "url"] }
