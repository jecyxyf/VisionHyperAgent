[package]
name = "vha-codex-dds-agent"
description = "CodexDDSAgent service with Zenoh and Codex App Server adapters"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace]
members = ["test"]

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
codex-app-server-protocol = { path = "../depends/codex/codex-rs/app-server-protocol" }
futures-util = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "url"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zenoh = { path = "../depends/zenoh/zenoh" }

[dev-dependencies]
tempfile = "3"
