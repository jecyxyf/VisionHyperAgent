[package]
name = "codex-dds-testui"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
vha-codex-dds-agent = { path = ".." }
zenoh = { path = "../../depends/zenoh/zenoh" }

[dev-dependencies]
tempfile = "3"
