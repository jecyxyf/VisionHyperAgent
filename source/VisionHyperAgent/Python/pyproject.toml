[project]
name = "vision-hyper-agent"
version = "0.1.0"
description = "VisionHyperAgent Python desktop client"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
VisionHyperAgent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "view",
    "viewmodel",
    "pybind",
]
